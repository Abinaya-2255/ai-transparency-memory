if(t.sc==='X')return md(reply(t));const n=turnUsed(t).length;
return md(reply(t))+changeNote(t)+`<div class="chips"><button class="chip g" data-act="chipv" data-id="${t.id}">${ic('check',14)}Verified</button>${SC[t.sc].mem.length?`<button class="chip b" data-act="chipm" data-id="${t.id}">${ic('mem',14)}Memory used · ${n}</button>`:''}<button class="chip x" data-act="explain" data-id="${t.id}">Explain response</button></div>`}
function chat(){const sg=Object.keys(SC).filter(k=>!S.turns.some(t=>t.sc===k));
return`<div class="top"><button class="ib mb" data-act="side" aria-label="Open menu">${ic('menu',20)}</button><h1>UI/UX internship decision</h1></div><div class="scroll" id="scroll"><div class="thread">${S.turns.map(t=>`<div class="um"><p>${esc(t.q)}</p><time>${t.time}</time></div><div class="ai"><div class="av">${ic('spark')}</div><div class="ab">${aiBody(t)}</div></div>`).join('')}</div></div><div class="comp">${sg.length?`<div class="sugg" aria-label="Try asking">${sg.map(k=>`<button class="chip" data-act="ask" data-id="${k}">${esc(SC[k].ask)}</button>`).join('')}</div>`:''}<div class="cbox"><textarea id="cin" rows="1" placeholder="Message the assistant" aria-label="Message"></textarea><button class="send" data-act="send" aria-label="Send">${ic('send')}</button></div><p class="fine">The assistant can make mistakes. Check important info.</p></div>`}
function drawer(){const t=T();if(!t||t.sc==='X')return'';const s=SC[t.sc],us=turnUsed(t),n=us.length,ns=s.src.length,hi=s.base==='High'&&n===s.mem.length;
const ver=s.src.map((x,i)=>`<div class="it"><b>${x[0]}</b><button class="btn sm" style="align-self:flex-start;margin-top:4px" data-act="src" data-id="${i}" aria-expanded="${!!U.src[i]}">${U.src[i]?'Hide source':'Show source'}</button>${U.src[i]?`<small>${x[1]} · ${x[2]}<br>Sample source for this prototype.</small>`:''}</div>`).join('');
const mem=s.mem.map(id=>{const m=find(id);if(!m)return'';const off=t.excl.includes(id),act=m.status==='active',x=U.mx===id;
return`<div class="it ${off||!act?'off':''}"><button class="mrow" data-act="mx" data-id="${id}" aria-expanded="${x}"><span><b>${esc(m.title)}</b><small>${act&&!off?s.why[id]:off?'Not used for this answer.':'Not used because it is '+m.status+'.'}</small></span>${ic('chev')}</button>${x?`<div class="mdet"><small>${esc(m.desc)}</small><span class="meta">Why it was used: ${s.why[id]}</span><span class="meta">Last used ${m.last} · ${m.status[0].toUpperCase()+m.status.slice(1)} · ${m.source}</span><div class="row">${act&&!off?`<button class="btn sm" data-act="excl" data-id="${id}">Don't use this memory for this answer</button>`:off&&act?`<button class="btn sm" data-act="incl" data-id="${id}">Use again</button>`:''}<button class="btn sm" data-act="manage" data-id="${id}">Manage memory</button></div></div>`:''}</div>`}).join('')||'<p class="muted">No memories shaped this answer.</p>';
const A=t.asm,lbl=A&&(A.status==='confirmed'?'You confirmed this.':A.status==='edited'?'You edited this.':'');
const asm=A?`<div class="it"><small>The assistant assumed</small><blockquote>${esc(A.text)}</blockquote>${lbl?`<span class="meta">${lbl}</span>`:''}</div>`+(U.ea?`<label for="atext">Your assumption</label><textarea class="in" id="atext" rows="3" data-af>${esc(A.text)}</textarea><div class="row"><button class="btn sm" data-act="suggest">Try an example</button></div><div class="row"><button class="btn p" data-act="aupdate">Update response</button><button class="btn" data-act="acancel">Cancel</button></div>`:`<div class="row">${A.status==='pending'?`<span class="muted" style="align-self:center">Is this correct?</span><button class="btn sm" data-act="ayes">Yes</button>`:''}<button class="btn sm" data-act="aedit">Edit</button></div>`):'';
return`<div class="dh"><div><h2>How this answer was made</h2><p>What shaped it, and what you can change.</p></div><button class="ib" data-act="close" aria-label="Close">${ic('x',18)}</button></div><div class="db"><div class="sum"><div class="lv ${hi?'':'m'}">${ic(hi?'check':'warn')}${hi?'High':'Moderate'} confidence</div><p>Based on ${pl(ns,'verified source','verified sources')}, ${pl(n,'memory','memories')} and ${A?'1 assumption':'no assumptions'}.</p><p>The facts are checked. The recommendation is a judgment shaped by your context${A||s.mem.length?', so it changes if you correct '+(A?'the assumption':'a memory')+(A&&s.mem.length?' or turn off a memory':''):''}.</p></div>${sec('ver','Verified',pl(ns,'source','sources'),ver)}${s.mem.length?sec('mem','Memory used',pl(n,'memory','memories'),mem):''}${A?sec('asm','Assumptions','1 assumption',asm):''}<p class="foot">Prototype with sample data. Sources are illustrative.</p></div>`}
function grid(){if(U.loading)return'<div class="card sk" style="height:152px"></div>'.repeat(3);const q=U.q.toLowerCase(),l=S.mem.filter(m=>(U.tab==='all'||m.status===U.tab)&&(U.cat==='All'||m.cat===U.cat)&&(m.title+m.desc).toLowerCase().includes(q)).sort((a,b)=>b.pinned-a.pinned);
return l.length?l.map(m=>`<button class="card" data-act="detail" data-id="${m.id}"><div class="tp"><span>${m.cat}</span>${sb(m)}</div><h2>${esc(m.title)}${m.pinned?`<span aria-label="Pinned">${ic('pin',14)}</span>`:''}</h2><p>${esc(m.desc)}</p><div class="bt"><span>Last used ${m.last}</span></div></button>`).join(''):`<div class="empty"><p>${S.mem.length?'No memories match your search.':"You haven't saved any memories yet."}</p><button class="btn" data-act="add">${ic('plus')}Add a memory</button></div>`}
function memory(){const C=['All','Career','Learning','Projects','Preferences'];
return`<div class="pg"><div class="wrap"><h1>Memory</h1><p class="sub">What the assistant remembers about you. You decide what it uses.</p><div class="ctl"><div class="sw">${ic('search')}<input class="in" id="q" type="search" placeholder="Search memories" aria-label="Search memories" value="${esc(U.q)}"></div><div class="tabs">${['all','active','paused','archived'].map(t=>`<button class="tab" data-act="tab" data-id="${t}" aria-pressed="${U.tab===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><select class="in" id="cat" aria-label="Category">${C.map(c=>`<option ${U.cat===c?'selected':''}>${c}</option>`).join('')}</select><button class="btn p" data-act="add">${ic('plus')}Add memory</button></div><div class="grid" id="grid">${grid()}</div><div class="how"><span>Paused, archived and deleted memories never shape answers. Deleting can't be undone.</span></div></div></div>`}
function modal(){const M=U.modal;if(!M)return'';const m=M.id&&find(M.id);let h='';
if(M.t==='detail'&&m)h=`<div class="mh"><div><h2>${esc(m.title)}</h2>${sb(m)}</div><button class="ib" data-act="mclose" aria-label="Close" data-af>${ic('x',18)}</button></div><p class="muted">${esc(m.desc)}</p><dl><dt>Category</dt><dd>${m.cat}</dd><dt>Source</dt><dd>${m.source}</dd><dt>Created</dt><dd>${m.created}</dd><dt>Last referenced</dt><dd>${m.last}</dd><dt>Used in</dt><dd>${m.count} responses</dd></dl><div class="acts"><button class="btn p" data-act="edit" data-id="${m.id}">Edit</button>${m.status==='active'?`<button class="btn" data-act="pause" data-id="${m.id}">Pause</button>`:m.status==='paused'?`<button class="btn" data-act="resume" data-id="${m.id}">Resume</button>`:`<button class="btn" data-act="restore" data-id="${m.id}">Restore</button>`}<button class="btn" data-act="pin" data-id="${m.id}">${m.pinned?'Unpin':'Pin'}</button>${m.status!=='archived'?`<button class="btn" data-act="archive" data-id="${m.id}">Archive</button>`:''}<button class="btn d" data-act="del" data-id="${m.id}">Delete</button></div>`;
else if(M.t==='edit'||M.t==='add'){const v=m||{title:'',desc:'',cat:'Career'};h=`<div class="mh"><h2>${m?'Edit memory':'Add memory'}</h2></div><div><label for="ft">Title</label><input class="in" id="ft" value="${esc(v.title)}" data-af></div><div><label for="fd">What should the assistant know?</label><textarea class="in" id="fd" rows="3">${esc(v.desc)}</textarea></div><div><label for="fc">Category</label><select class="in" id="fc" style="width:100%">${['Career','Learning','Projects','Preferences'].map(c=>`<option ${v.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="acts" style="border:0;padding:0"><button class="btn p" data-act="save" data-id="${m?m.id:''}">Save changes</button><button class="btn" data-act="mcancel" data-id="${m?m.id:''}">Cancel</button></div>`}
else if(M.t==='delete'&&m)h=`<div class="mh"><h2>Delete this memory?</h2></div><p class="muted">"${esc(m.title)}" will stop shaping any answers. This can't be undone.</p><div class="acts" style="border:0;padding:0"><button class="btn d" data-act="confirmdel" data-id="${m.id}">Delete memory</button><button class="btn" data-act="mcancel" data-id="${m.id}" data-af>Cancel</button></div>`;
return`<div class="ov"><div class="md" role="dialog" aria-modal="true" aria-label="Memory">${h}</div></div>`}
function render(){if(U.dr&&!T())U.dr=false;const cin=$('#cin'),cv=cin?cin.value:'',pm=U.pm,ae=document.activeElement,fk=ae&&ae.dataset&&ae.dataset.act?[ae.dataset.act,ae.dataset.id]:null;
const c=U.view==='chat';
$('#app').innerHTML=`<div class="app ${U.dr?'dr':''}"><aside class="side ${U.side?'on':''}" aria-label="Sidebar"><div class="brand">${ic('spark',20)}Assistant</div><button class="nav" data-act="nav" data-id="chat" ${c?'aria-current="page"':''}>${ic('chat',18)}UI/UX internship decision</button><button class="nav" data-act="nav" data-id="memory" ${!c?'aria-current="page"':''}>${ic('mem',18)}Memory<span class="n">${S.mem.filter(m=>m.status==='active').length} active</span></button><div class="sp"></div><button class="nav" style="height:32px;font-size:13px;color:var(--t3)" data-act="reset">Reset demo</button><div class="me"><i>A</i><div>Abby</div></div></aside><main class="main">${c?chat():memory()}</main></div><div class="sc ${U.side?'on sd':(U.dr&&c&&innerWidth<=1100?'on':'')}" data-act="${U.side?'side':'close'}"></div><aside class="drawer ${U.dr&&c?'on':''}" role="complementary" aria-label="Explain response">${c?drawer():''}</aside>${modal()}`;
if(c){const n=$('#cin');n.value=cv;const s=$('#scroll');if(s&&U.stick)s.scrollTop=s.scrollHeight;U.stick=0}
if(U.modal){const f=$('.md [data-af]');f&&f.focus()}
else if(U.dr&&c&&!U.pdr){const f=$('.drawer .ib');f&&f.focus()}
else if(pm&&U.ret){const f=document.querySelector(`[data-act="${U.ret[0]}"]`+(U.ret[1]?`[data-id="${U.ret[1]}"]`:''));f&&f.focus()}
else if(fk){const f=document.querySelector(`[data-act="${fk[0]}"]`+(fk[1]?`[data-id="${fk[1]}"]`:''));f&&f.focus()}
if(U.focus){const f=document.getElementById('sec-'+U.focus);f&&f.scrollIntoView({block:'nearest'});U.focus=null}
U.pdr=U.dr;U.pm=!!U.modal}
function mut(id,fn,msg){const m=find(id);if(!m)return;fn(m);save();U.modal={t:'detail',id};toast(msg);render()}
document.addEventListener('click',e=>{
const ov=e.target.classList.contains('ov');if(ov){U.modal=null;return render()}
const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,m=id&&find(id);if(a==='detail'||a==='add')U.ret=[a,id];
switch(a){
case'nav':U.view=id;U.side=false;U.dr=false;break;
case'side':U.side=!U.side;break;
case'explain':U.turn=id;U.dr=true;U.open={};U.mx=null;break;
case'chipv':U.turn=id;U.dr=true;U.open={ver:1};U.focus='ver';break;
case'chipm':U.turn=id;U.dr=true;U.open={mem:1};U.mx=null;U.focus='mem';break;
case'close':U.dr=false;break;
case'sec':U.open[id]=!U.open[id];break;
case'src':U.src[id]=!U.src[id];break;
case'mx':U.mx=U.mx===id?null:id;break;
case'manage':U.view='memory';U.dr=false;U.modal={t:'detail',id};break;
case'excl':{const t=T();t.excl.push(id);save();toast(`Won't use "${m.title}" for this answer`);return regen(t.id)}
case'incl':{const t=T();t.excl=t.excl.filter(x=>x!==id);save();toast(`Using "${m.title}" again`);return regen(t.id)}
case'ayes':T().asm.status='confirmed';save();toast('Assumption confirmed');break;
case'aedit':U.ea=true;U.open.asm=1;break;
case'acancel':U.ea=false;break;
case'suggest':$('#atext').value=SC[T().sc].sug;return;
case'aupdate':{const t=T(),v=$('#atext').value.trim();if(!v)return toast('Write your assumption first');t.asm={text:v,status:'edited'};t.upd=true;U.ea=false;save();toast('Response updated using your correction.');return regen(t.id)}
case'detail':U.modal={t:'detail',id};break;
case'mclose':U.modal=null;break;
case'mcancel':U.modal=id?{t:'detail',id}:null;break;
case'edit':U.modal={t:'edit',id};break;
case'add':U.modal={t:'add'};break;
case'del':U.modal={t:'delete',id};break;
case'save':{const t=$('#ft').value.trim();if(!t)return toast('Add a title first');const d=$('#fd').value.trim()||'No description yet.',c=$('#fc').value;
if(id){Object.assign(m,{title:t,desc:d,cat:c});toast('Memory saved');U.modal={t:'detail',id}}
else{S.mem.push({id:'m'+Date.now(),title:t,desc:d,cat:c,status:'active',pinned:false,source:'Added by you',created:new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}),last:'Never',count:0});U.modal=null;toast('Memory added')}
save();break}
case'confirmdel':S.mem=S.mem.filter(x=>x.id!==id);S.turns.forEach(t=>t.excl=t.excl.filter(x=>x!==id));save();U.modal=null;toast('Memory deleted');returnrender();
case'pause':return mut(id,m=>m.status='paused','Memory paused');
case'resume':return mut(id,m=>m.status='active','Memory resumed');
case'restore':return mut(id,m=>m.status='active','Memory restored');
case'archive':return mut(id,m=>m.status='archived','Memory archived');
case'pin':return mut(id,m=>m.pinned=!m.pinned,m.pinned?'Memory unpinned':'Memory pinned');
case'tab':U.tab=id;break;
case'reset':S=seed();Object.assign(U,U0());save();toast('Demo reset');break;
case'send':case'ask':{let q;if(a==='ask')q=SC[id].ask;else{const i=$('#cin');q=i.value.trim();i.value=''}if(!q)return;const tn={id:'t'+Date.now(),q,sc:pick(q),time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),excl:[],upd:false};tn.asm=tn.sc!=='X'&&SC[tn.sc].asm?{text:SC[tn.sc].asm,status:'pending'}:null;S.turns.push(tn);save();return regen(tn.id,'Thinking…')}
}render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){U.q=e.target.value;$('#grid').innerHTML=grid()}});
document.addEventListener('change',e=>{if(e.target.id==='cat'){U.cat=e.target.value;$('#grid').innerHTML=grid()}});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'){if(U.modal)U.modal=null;else if(U.dr)U.dr=false;else if(U.side)U.side=false;else return;render()}
if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='cin'){e.preventDefault();document.querySelector('[data-act=send]').click()}});
addEventListener('resize',()=>{clearTimeout(U.rt);U.rt=setTimeout(render,150)});
render();setTimeout(()=>{U.loading=false;render()},450);
</script></body></html>
